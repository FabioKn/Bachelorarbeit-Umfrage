<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Position & Distanz</title>
  <script type="module" src="js/supabase-client.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 960px; margin: auto; }
    canvas { display: block; border: 1px solid #ccc; margin-bottom: 1em; touch-action: manipulation; }
    #status { font-weight: bold; margin: 1em 0; }
    #distance-form { display: none; }
  </style>
</head>
<body>
  <header style="display: flex; justify-content: space-between; align-items: center;">
    <h1>Räumliche Kognition in virtuellen Umgebungen</h1>
    <img src="HTWK.svg" alt="HTWK Leipzig" style="height: 60px;">
  </header>

  <h1>Objektpositionen & Distanzschätzung</h1>
  <p id="instruction">
    Bitte klicke auf die Stelle, an der du Objekt <strong id="current-object">A</strong> gesehen hast.
  </p>
  <p id="object-description">Objekt A: Lichter, Objekt B: Raben</p>

  <canvas id="sceneCanvas" width="800" height="500"></canvas>

  <div id="status">Warte auf Klick für Objekt A…</div>

  <div id="distance-form">
    <p><strong>Wie weit waren die beiden Objekte ungefähr voneinander entfernt?</strong></p>
    <input type="number" id="estimated-distance" step="0.1" min="0" placeholder="Distanz in Metern" required>
    <button id="submit-distance">Absenden</button>
  </div>

  <script type="module">
    import { submitClick, submitDistanceEstimate } from './js/supabase-client.js';

    const canvas = document.getElementById("sceneCanvas");
    const ctx = canvas.getContext("2d");

    const images = [
      { src: "../Bilder/RegaleVogel.png", label: "Sofa1", instruction: "Bitte klicke auf auf den Bereich, wo das Sofa steht." },
      { src: "../Bilder/RegaleVogel.png", label: "Betonwand", instruction: "Bitte klicke auf den Bereich, wo die Betonwand ist." },
      { src: "../Bilder/Bibliothek.jpg", label: "Sofa2", instruction: "Wo stand das Sofa? Bitte markiere es." }
    ];

    let currentIndex = 0;
    let currentImage = new Image();
    let imageLoaded = false;

    function loadImage(index) {
      imageLoaded = false;
      currentImage = new Image();
      currentImage.src = images[index].src;
      currentImage.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
        imageLoaded = true;
        document.getElementById("instruction").textContent = images[index].instruction;
        document.getElementById("current-object").textContent = images[index].label;
        document.getElementById("object-description").style.display = index < 2 ? "block" : "none";
      };
    }

    function drawMarker(x, y, color) {
      if (!imageLoaded) return;
      ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, 2 * Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
    }

    async function handleClick(x, y) {
      const label = images[currentIndex].label;
      drawMarker(x, y, currentIndex === 0 ? "red" : currentIndex === 1 ? "blue" : "green");

      const success = await submitClick({ object_label: label, x, y, z: 0 });
      if (success !== false) {
        currentIndex++;
        if (currentIndex < images.length) {
          loadImage(currentIndex);
          document.getElementById("status").textContent = `Klick für Objekt ${images[currentIndex].label} erwartet…`;
        } else {
          document.getElementById("status").textContent = "Objekte gespeichert. Jetzt bitte die Distanz schätzen.";
          document.getElementById("distance-form").style.display = "block";
        }
      }
    }

    function handleInput(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.round(clientX - rect.left);
      const y = Math.round(clientY - rect.top);
      handleClick(x, y);
    }

    canvas.addEventListener("click", e => handleInput(e.clientX, e.clientY));
    canvas.addEventListener("touchstart", e => {
      const touch = e.touches[0];
      if (touch) handleInput(touch.clientX, touch.clientY);
    });

    document.getElementById('submit-distance').addEventListener('click', async () => {
      const val = parseFloat(document.getElementById('estimated-distance').value);
      if (isNaN(val) || val < 0) {
        alert("Bitte eine gültige Zahl eingeben.");
        return;
      }
      const success = await submitDistanceEstimate(val);
      if (success !== false) {
        alert("Vielen Dank! Deine Eingaben wurden gespeichert.");
        window.location.href = "index.html";
      }
    });

    // Start
    loadImage(currentIndex);
  </script>
</body>
</html>
